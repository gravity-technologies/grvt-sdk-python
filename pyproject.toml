[project]
name = "grvt"
version = "0.1.0"
description = "Grvt exchange SDK (preview)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
classifiers = ["Development Status :: 4 - Beta"]
dependencies = [
    "msgspec>=0.18",
    "aiohttp>=3.12",
    "coincurve>=20",
    "pycryptodome>=3.20,<4",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "eth-account>=0.13",
    "ruff==0.17.3",
    "pyright[nodejs]==1.1.414",
    "twine==7.0.0",
]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

# The generated code and CHANGELOG.md are git-ignored build output (`make sdk-gen-python`); `artifacts` keeps them in
# both packages anyway.
[tool.hatch.build]
artifacts = ["src/grvt/_generated/*.py", "CHANGELOG.md"]

[tool.hatch.build.targets.wheel]
packages = ["src/grvt"]

# The sdist carries the package and its docs only; tests read sdk/contract and sdk/scenarios, outside this folder.
[tool.hatch.build.targets.sdist]
include = ["src/grvt", "README.md", "CHANGELOG.md", "RUNTIME_API.md", "LICENSE"]

# The one uv version for local runs and CI (the workflows install this one).
[tool.uv]
required-version = "==0.13.6"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "smoke: talks to Grvt testnet market data (read-only, unauthenticated); runs only with GRVT_SMOKE=1",
]

# ruff targets requires-python; pyright needs pythonVersion spelled out, and sdk/scripts/release-readiness.py holds it to
# the floor in sdk/metadata.json.
[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# ruff format owns line length; the leftovers are long string literals and URLs.
ignore = ["E501"]

[tool.pyright]
include = ["src", "tests", "examples"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
# The shipped package is held to strict; tests stay at standard.
strict = ["src"]
# Tests import their helpers (eip712_reference) the way pytest puts tests/ on sys.path.
extraPaths = ["tests"]
# The guides include the examples as they are, so they get the same leniency as code on a portal page
# (sdk/portal/tests/check_code.py): a reader's snippet need not prove every Optional is set.
executionEnvironments = [
  { root = "examples", reportOptionalMemberAccess = "none", reportOptionalSubscript = "none", reportOptionalIterable = "none", reportPossiblyUnboundVariable = "none" },
]
